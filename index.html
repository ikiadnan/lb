<!DOCTYPE html>
<html lang="id">
<head>
    <meta property="og:title" content="Berbagi Umrah | Masjid Baitul Faizin" />
    <meta property="og:description" content="Informasi terkait program berbagi umrah di Masjid Baitul Faizin." />
    <meta property="og:image" itemprop="image" content="https://raw.githubusercontent.com/baitulfaizin/berbagiumrah/main/baitulfaizin.jpg" />

    <title>Berbagi Umrah | Masjid Baitul Faizin</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            /* Mengizinkan scrolling penuh secara halus di perangkat mobile */
            overflow: auto; 
            -webkit-overflow-scrolling: touch;
            background-color: #f4f7f6;
        }
        
        .container {
            width: 100%;
            /* Menggunakan min-height agar kontainer bisa memanjang jika konten dalam iframe sangat tinggi */
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        
        iframe {
            width: 100%;
            /* Menggunakan flex-grow agar tinggi iframe otomatis mengisi sisa ruang yang tersedia tanpa terpotong */
            flex-grow: 1; 
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <iframe 
            src="https://script.google.com/macros/s/AKfycbyvWXOwtea4IfZrY2fKTbp-c5tlSuDL7NP2bemi0SgzJGCz7UYBGTfLWrQ-PClPkZl4_A/exec" 
            allowfullscreen>
        </iframe>
    </div>

</body>
